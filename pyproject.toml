[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pokemon-to-linux"
version = "0.1.0.dev0"
description = "Lanzador y gestor de compatibilidad para ejecutar fangames de Pokémon (RPG Maker XP) en Linux."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jose Pulido Diaz" }]
keywords = ["pokemon", "fangame", "rpg-maker-xp", "wine", "mkxp-z", "linux", "r36s"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.gui-scripts]
pokemon-to-linux = "pokemon_to_linux.main:main"

[project.scripts]
pokemon-to-linux-cli = "pokemon_to_linux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_to_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: pruebas que levantan Qt u otros componentes reales",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert está bien en tests
