name: Release

# Al subir una etiqueta vX.Y.Z (o vX.Y.Z-alpha.N…) se construye el ejecutable para
# Linux x86_64, se prueba que arranca y se publica en la release de esa etiqueta.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta ya existente para la que construir (p. ej. v0.1.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Ejecutable Linux x86_64
    # La glibc más antigua que se pueda: el ejecutable funciona en esa y en las posteriores.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            xvfb xauth

      - name: La etiqueta coincide con la versión de pyproject.toml
        id: version
        run: |
          python -m pip install packaging
          version=$(python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          assert Version(project) == Version(tag), f"{tag} != {project}"
          print(Version(project))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Construir con PyInstaller
        run: |
          python -m pip install . "pyinstaller>=6.10"
          pyinstaller --noconfirm packaging/pyinstaller/pokemon-to-linux.spec

      - name: El ejecutable arranca
        run: |
          exe=dist/pokemon-to-linux
          "$exe" cli --version | grep -F "${{ steps.version.outputs.version }}"
          "$exe" cli profiles
          code=0
          QT_QPA_PLATFORM=xcb xvfb-run -a timeout 10 "$exe" || code=$?
          if [ "$code" -ne 124 ]; then
            echo "La interfaz no se mantuvo abierta (código $code)"
            exit 1
          fi
          grep -q "Iniciando" ~/.local/state/pokemon-to-linux/logs/pokemon-to-linux.log

      - name: Empaquetar
        id: pack
        run: |
          name="pokemon-to-linux-${{ steps.version.outputs.version }}-x86_64"
          # stage/: contenido del .tar.gz · out/: lo que se sube a la release
          mkdir -p "stage/$name" out
          cp dist/pokemon-to-linux "stage/$name/$name"
          cp packaging/linux/install.sh LICENSE "stage/$name/"
          sed "s/@VERSION@/${{ steps.version.outputs.version }}/g" packaging/linux/LEEME.txt > "stage/$name/LEEME.txt"
          chmod +x "stage/$name/$name" "stage/$name/install.sh"
          tar czf "out/$name.tar.gz" -C stage "$name"
          cp "stage/$name/$name" out/
          cd out
          sha256sum "$name.tar.gz" "$name" > SHA256SUMS
          cat SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publicar en la release
        run: |
          cd out
          name="${{ steps.pack.outputs.name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" $prerelease --verify-tag --title "Pokémon to Linux $TAG" \
              --notes "Instrucciones en el README."
          fi
          gh release upload "$TAG" --clobber "$name.tar.gz" "$name" SHA256SUMS
