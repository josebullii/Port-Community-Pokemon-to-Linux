name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux · Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es la mínima declarada en pyproject.toml
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update
          # Base de Qt (modo offscreen) + bibliotecas X11 del plugin xcb
          # (misma lista que en README.md y docs/development.md) + Xvfb.
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            xvfb xauth

      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas (pytest)
        run: pytest

      - name: La aplicación arranca
        run: |
          code=0
          timeout 5 pokemon-to-linux || code=$?
          # 124 = la cerró timeout tras 5 s, es decir, seguía en marcha
          if [ "$code" -ne 124 ]; then
            echo "La aplicación terminó antes de tiempo (código $code)"
            exit 1
          fi
          grep -q "Iniciando" ~/.local/state/pokemon-to-linux/logs/pokemon-to-linux.log

      - name: Bibliotecas X11 completas
        run: |
          plugin=$(python -c "import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so')")
          missing=$(ldd "$plugin" | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "Faltan bibliotecas para el plugin xcb (actualiza README y docs/development.md):"
            echo "$missing"
            exit 1
          fi

      - name: La aplicación arranca en X11 (Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          code=0
          xvfb-run -a timeout 5 pokemon-to-linux || code=$?
          if [ "$code" -ne 124 ]; then
            echo "La aplicación no se mantuvo abierta en X11 (código $code)"
            exit 1
          fi

      - name: Construir el paquete
        run: python -m pip wheel . --no-deps -w dist
