name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux · Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es la mínima declarada en pyproject.toml
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64

      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas (pytest)
        run: pytest

      - name: La aplicación arranca
        run: |
          code=0
          timeout 5 pokemon-to-linux || code=$?
          # 124 = la cerró timeout tras 5 s, es decir, seguía en marcha
          if [ "$code" -ne 124 ]; then
            echo "La aplicación terminó antes de tiempo (código $code)"
            exit 1
          fi
          grep -q "Iniciando" ~/.local/state/pokemon-to-linux/logs/pokemon-to-linux.log

      - name: Construir el paquete
        run: python -m pip wheel . --no-deps -w dist
